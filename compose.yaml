services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: animals_db
      POSTGRES_USER: animals_user
      POSTGRES_PASSWORD: animals_pass
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  systemanimals:
    image: systemanimals
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/animals_db
      DB_USERNAME: animals_user
      DB_PASSWORD: animals_pass
    ports:
      - 8080:8080

volumes:
  postgres-data:
